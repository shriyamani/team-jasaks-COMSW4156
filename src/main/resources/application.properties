spring.application.name=jasaks

# Local Postgres DB connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/jasaks}
spring.datasource.username=${DB_USER:jasaks}
spring.datasource.password=${DB_PASSWORD:jasaks}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mvc.problemdetails.enabled = true